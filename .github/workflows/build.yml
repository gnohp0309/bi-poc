name: Build and API smoke

on:
  push:
    branches: [main, 'feature/**', 'fix/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: Demo2026!
          POSTGRES_DB: bi_poc_app
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d bi_poc_app"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ai-service/requirements*.txt
      - name: Verify AI contract without a provider key
        run: |
          pip install -r ai-service/requirements-test.txt
          python -m unittest discover -s ai-service -p test_main.py -v
      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Check frontend data and export contracts
        run: node --experimental-strip-types --test dev/chat-results.test.mjs dev/dashboard-layout.test.mjs dev/template-mapping.test.mjs dev/dashboard-export.test.mjs
      - name: Verify and package backend
        working-directory: backend
        run: mvn -B verify
      - name: Prepare isolated sample database
        env:
          PGPASSWORD: Demo2026!
        run: |
          psql -h 127.0.0.1 -p 5433 -U postgres -d postgres -v ON_ERROR_STOP=1 -c "CREATE ROLE bi_reader LOGIN PASSWORD 'Reader2026!'"
          createdb -h 127.0.0.1 -p 5433 -U postgres bi_poc_source
          psql -h 127.0.0.1 -p 5433 -U postgres -d postgres -v ON_ERROR_STOP=1 -c "ALTER DATABASE bi_poc_source SET timezone TO 'Asia/Bangkok'"
          psql -h 127.0.0.1 -p 5433 -U postgres -d bi_poc_source -v ON_ERROR_STOP=1 -f dev/source.sql
          psql -h 127.0.0.1 -p 5433 -U postgres -d bi_poc_app -v ON_ERROR_STOP=1 -c 'CREATE SCHEMA uploads; GRANT USAGE ON SCHEMA uploads TO bi_reader;'
      - name: Start backend
        run: |
          nohup java -jar backend/target/bi-poc-0.1.0.jar > /tmp/bi-poc-app.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8081/api/health; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/bi-poc-app.log
          exit 1
      - name: Create demo roles for smoke checks
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $base = 'http://127.0.0.1:8081/api'
          $login = Invoke-RestMethod -Method Post -Uri "$base/auth/login" -ContentType 'application/json' -Body '{"username":"admin","password":"Demo2026!"}'
          $headers = @{Authorization="Bearer $($login.token)"}
          foreach ($role in @('ANALYST','VIEWER')) {
            $body = @{username=$role.ToLowerInvariant();password='Demo2026!';role=$role} | ConvertTo-Json -Compress
            Invoke-RestMethod -Method Post -Uri "$base/users" -Headers $headers -ContentType 'application/json' -Body $body | Out-Null
          }
      - name: Check source, SQL, chart, dashboard and roles
        shell: pwsh
        run: ./dev/smoke.ps1
      - name: Check CSV import and invalid inputs
        shell: pwsh
        run: ./dev/smoke-import.ps1
      - name: Check dashboard template creation
        shell: pwsh
        run: ./dev/smoke-templates.ps1
      - name: Check dataset analysis, validation and 500000 rows
        shell: pwsh
        run: ./dev/smoke-analysis.ps1
      - name: Check dashboard editor and grid persistence
        shell: pwsh
        run: ./dev/smoke-dashboard-editor.ps1
      - name: Check dashboard filters, drill-down and live refresh
        shell: pwsh
        run: ./dev/smoke-dashboard-interaction.ps1
      - name: Check advanced chart types and persistence
        shell: pwsh
        run: ./dev/smoke-visualizations.ps1
      - name: Check dataset exploration and profiling
        shell: pwsh
        run: ./dev/smoke-exploration.ps1
      - name: Check real PNG, PDF and Excel downloads
        run: |
          google-chrome --headless=new --no-sandbox --disable-dev-shm-usage --remote-debugging-port=9226 --user-data-dir=/tmp/bi-poc-export-browser http://127.0.0.1:8081 > /tmp/bi-poc-export-browser.log 2>&1 &
          chrome_pid=$!
          trap 'kill "$chrome_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:9226/json/version > /dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:9226/json/version > /dev/null
          node dev/smoke-export.cjs
      - name: Start real FastAPI with a deterministic test provider
        run: |
          nohup python dev/chat-test-ai.py --port 8000 > /tmp/bi-poc-ai.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/; then exit 0; fi
            sleep 1
          done
          cat /tmp/bi-poc-ai.log
          exit 1
      - name: Check integrated chat and transaction rollback
        run: python dev/smoke-chat.py --db-name bi_poc_app
      - name: Backend log on failure
        if: failure()
        run: |
          cat /tmp/bi-poc-app.log 2>/dev/null || true
          cat /tmp/bi-poc-ai.log 2>/dev/null || true
