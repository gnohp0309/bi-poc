server.port=${POC_PORT:8081}
server.address=${POC_BIND_ADDRESS:127.0.0.1}
spring.datasource.url=${POC_DB_URL:jdbc:postgresql://127.0.0.1:5433/bi_poc_app}
spring.datasource.username=${POC_DB_USER:postgres}
spring.datasource.password=${POC_DB_PASSWORD:Demo2026!}
spring.sql.init.mode=always
spring.sql.init.continue-on-error=false
spring.jackson.serialization.write-dates-as-timestamps=false
server.error.include-message=never
poc.admin.password=${POC_ADMIN_PASSWORD:Demo2026!}
poc.secret.key=${POC_SECRET_KEY:local-poc-key-change-before-sharing}
poc.allowed-db-hosts=${POC_ALLOWED_DB_HOSTS:127.0.0.1,localhost}
spring.servlet.multipart.max-file-size=200MB
spring.servlet.multipart.max-request-size=201MB
poc.upload.reader.password=${POC_UPLOAD_READER_PASSWORD:Reader2026!}
